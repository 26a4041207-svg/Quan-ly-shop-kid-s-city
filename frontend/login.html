<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Kid's City</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }
        body { background-color: #1e3a8a; background-image: radial-gradient(circle at 30% 50%, rgba(255,255,255,.08) 0%, transparent 40%), radial-gradient(circle at 30% 50%, rgba(255,255,255,.04) 0%, transparent 60%); display: flex; height: 100vh; align-items: center; justify-content: center; color: #fff; }
        .login-wrapper { display: flex; width: 100%; max-width: 1000px; align-items: center; gap: 60px; padding: 20px; }
        .login-left { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo-box { width: 80px; height: 80px; background: rgba(255,255,255,.2); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.1); }
        .login-left h1 { font-size: 36px; font-weight: 700; margin-bottom: 10px; }
        .login-left p { color: #bfdbfe; font-size: 15px; margin-bottom: 40px; }
        .stats-grid { display: flex; gap: 15px; }
        .stat-item { background: rgba(255,255,255,.1); padding: 15px 20px; border-radius: 12px; backdrop-filter: blur(10px); min-width: 110px; }
        .stat-item h3 { font-size: 20px; margin-bottom: 4px; }
        .stat-item span { font-size: 12px; color: #bfdbfe; }
        .login-right { flex: 1; display: flex; justify-content: flex-end; }
        .login-card { background: #fff; color: #333; width: 100%; max-width: 420px; padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
        .login-card h2 { font-size: 24px; margin-bottom: 8px; color: #1e293b; }
        .login-card > p { font-size: 14px; color: #64748b; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #334155; }
        .input-wrapper { position: relative; }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; transition: .3s; }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; cursor: pointer; font-size: 18px; }
        .btn-login { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: .3s; }
        .btn-login:hover { background: #1d4ed8; }
        .btn-login:disabled { cursor: not-allowed; opacity: .75; }
        @media (max-width: 768px) {
            .login-wrapper { flex-direction: column; gap: 30px; }
            .login-left { margin-bottom: 20px; }
            .login-right { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-left">
            <div class="logo-box"><i class="bx bxs-face"></i></div>
            <h1>Kid's City</h1>
            <p>Hệ thống quản lý bán hàng nội bộ</p>
            <div class="stats-grid">
                <div class="stat-item"><h3>10+</h3><span>Nhân viên</span></div>
                <div class="stat-item"><h3>200+</h3><span>Sản phẩm</span></div>
                <div class="stat-item"><h3>1K+</h3><span>Đơn hàng</span></div>
            </div>
        </div>
        <div class="login-right">
            <div class="login-card">
                <h2>Đăng nhập</h2>
                <p>Nhập tài khoản đã được tạo trong hệ thống để tiếp tục.</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
                            <i class="bx bx-show toggle-password" id="togglePassword"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn-login"><i class="bx bx-log-in-circle"></i> Đăng nhập</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=20260612-toast-fix"></script>
    <script>
        if (localStorage.getItem("isLoggedIn") === "true" && localStorage.getItem("authToken")) {
            window.location.href = "index.html";
        }

        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const loginButton = document.querySelector(".btn-login");

        togglePassword.addEventListener("click", function () {
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
            this.classList.toggle("bx-show");
            this.classList.toggle("bx-hide");
        });

        const setLoginLoading = (isLoading) => {
            loginButton.disabled = isLoading;
            loginButton.innerHTML = isLoading
                ? "<i class='bx bx-loader-alt bx-spin'></i> Đang xử lý..."
                : "<i class='bx bx-log-in-circle'></i> Đăng nhập";
        };

        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            setLoginLoading(true);

            try {
                const result = await window.kidCityApi.post("auth/login.php", { username, password });
                const account = result.user;
                localStorage.setItem("authToken", result.token);
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("currentUser", JSON.stringify({
                    id: account.id,
                    username: account.username || username,
                    name: account.name || username,
                    fullname: account.name || username,
                    email: account.email || "",
                    phone: account.phone || username,
                    role: account.role || "staff",
                    roleLabel: account.roleLabel || (account.role === "admin" ? "Chủ shop" : "Nhân viên")
                }));
                localStorage.setItem("currentRole", account.role || "staff");
                window.location.href = "index.html";
            } catch (error) {
                alert(error.message || "Tên đăng nhập hoặc mật khẩu không đúng.");
                localStorage.removeItem("authToken");
                localStorage.removeItem("isLoggedIn");
                localStorage.removeItem("currentUser");
                localStorage.removeItem("currentRole");
                setLoginLoading(false);
            }
        });
    </script>
</body>
</html>
