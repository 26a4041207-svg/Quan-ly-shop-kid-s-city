<script>if (!document.querySelector('.main-wrapper')) location.replace('../../index.html#sales/invoices');</script>
<div class="sales-page" id="invoice-page">
    <div class="page-header">
        <h1>Quản lý hóa đơn</h1>
        <p>Quản lý hóa đơn bán hàng</p>
    </div>


    <div class="sales-toolbar">
        <label class="sales-search"><i class='bx bx-search'></i><input type="text" id="invoice-search" placeholder="Tìm kiếm hóa đơn..."></label>
        <button class="sales-btn primary" data-open="invoice-create"><i class='bx bx-plus'></i> Tạo hóa đơn</button>
    </div>

    <div class="sales-card">
        <table class="sales-table invoice-list-table">
            <thead><tr><th>M&#227; h&#243;a &#273;&#417;n</th><th>Ng&#224;y l&#7853;p</th><th>Kh&#225;ch h&#224;ng</th><th>Nh&#226;n vi&#234;n</th><th>Thao t&#225;c</th></tr></thead>
            <tbody id="invoice-table">
            </tbody>
        </table>
    </div>
    <div class="sales-pagination" id="invoice-pagination"></div>

    <div class="sales-modal" id="invoice-create">
        <div class="sales-dialog">
            <div class="sales-modal-header"><h3>Tạo hóa đơn mới</h3><button class="modal-close" data-close>&times;</button></div>
            <div class="sales-modal-body">
                <div class="form-grid">
                    <div class="field invoice-customer-field"><label>Khách hàng <span class="required">*</span></label><div class="customer-select-row"><select><option value="">-- Chọn khách hàng --</option></select><a class="add-customer-link inline" href="#" data-add-invoice-customer title="Thêm khách hàng mới"><i class='bx bx-user-plus'></i></a></div></div>
                    <div class="field"><label>Ngày lập hóa đơn</label><input type="text" id="invoice-date-input" readonly></div>
                    <div class="field full"><label>Ghi chú</label><input type="text" placeholder="Ghi chú hóa đơn (tùy chọn)..."></div>
                </div>
                <h4 class="section-title add-title">Thêm sản phẩm</h4>
                <div class="add-product">
                    <div class="field product-combobox-field">
                        <label>Chọn sản phẩm</label>
                        <div class="product-combobox" data-product-combobox>
                            <input type="text" data-product-search placeholder="Nhập tên hoặc mã sản phẩm..." autocomplete="off">
                            <input type="hidden" data-product-value>
                            <button type="button" class="combo-toggle" data-product-toggle aria-label="Mở danh sách sản phẩm"><i class='bx bx-chevron-down'></i></button>
                            <div class="combo-options" data-product-options></div>
                        </div>
                        <div class="selected-product-info" style="display: none; margin-top: 10px; padding: 12px; background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 8px; justify-content: space-between; align-items: center;"></div>
                    </div>
                    <div class="field"><label>Số lượng</label><input type="number" min="1" value="1"></div>
                    <button class="sales-btn primary"><i class='bx bx-plus'></i> Thêm SP</button>
                </div>
                <div class="sales-card"><table class="sales-table"><thead><tr><th>STT</th><th>Mã SP</th><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th><th>Thao tác</th></tr></thead><tbody><tr><td colspan="7" class="empty-row">Chưa có sản phẩm. Thêm sản phẩm ở trên.</td></tr></tbody></table></div>
                <div class="invoice-summary">
                    <div class="summary-row"><span>Tổng tiền</span><strong data-invoice-subtotal>0đ</strong></div>
                    <div class="summary-row discount-row">
                        <span>Ưu đãi</span>
                        <input type="text" data-invoice-discount value="0đ">
                    </div>
                    <div class="summary-row total-row"><span>Thành tiền</span><strong data-invoice-total>0đ</strong></div>
                </div>
                <div class="modal-actions invoice-actions"><span></span><div class="action-buttons"><button class="sales-btn light" data-close>Hủy</button><button class="sales-btn primary">Tạo hóa đơn</button></div></div>
            </div>
        </div>
    </div>
</div>
